server {
    listen 8080 default_server;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        proxy_pass http://rekor-server:3000/healthz;
    }

    location = /api/v2/log/entries {
        proxy_pass http://rekor-server:3000/api/v2/log/entries;
        client_max_body_size 4m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /checkpoint {
        root /var/lib/sigstore/data/primary;
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location = /shards/secondary/healthz {
        set $secondary_backend http://rekor-server-secondary:3000;
        proxy_pass $secondary_backend/healthz;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /shards/secondary/api/v2/log/entries {
        set $secondary_backend http://rekor-server-secondary:3000;
        proxy_pass $secondary_backend/api/v2/log/entries;
        client_max_body_size 4m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /shards/secondary/checkpoint {
        alias /var/lib/sigstore/data/secondary/checkpoint;
        add_header Cache-Control "no-store";
    }

    location /shards/secondary/api/v2/tile/ {
        alias /var/lib/sigstore/data/secondary/api/v2/tile/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /var/lib/sigstore/data/primary;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

server {
    listen 8080;
    server_name rekor-secondary-sigstore.dev.localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        set $secondary_backend http://rekor-server-secondary:3000;
        proxy_pass $secondary_backend/healthz;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /api/v2/log/entries {
        set $secondary_backend http://rekor-server-secondary:3000;
        proxy_pass $secondary_backend/api/v2/log/entries;
        client_max_body_size 4m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /checkpoint {
        root /var/lib/sigstore/data/secondary;
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location / {
        root /var/lib/sigstore/data/secondary;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
