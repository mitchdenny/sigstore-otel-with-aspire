server {
    listen 8080;
    server_name _;

    location = /healthz {
        proxy_pass http://rekor-server:3000/healthz;
    }

    location = /api/v2/log/entries {
        proxy_pass http://rekor-server:3000/api/v2/log/entries;
        client_max_body_size 4m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location = /checkpoint {
        root /var/lib/sigstore/data/rekor;
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    location / {
        root /var/lib/sigstore/data/rekor;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
